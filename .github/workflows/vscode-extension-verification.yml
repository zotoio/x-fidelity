name: VSCode Extension Verification

on:
  push:
    branches: [master]
    paths: ['packages/x-fidelity-vscode/**', 'packages/x-fidelity-core/**', 'packages/x-fidelity-types/**', 'packages/x-fidelity-plugins/**']
  pull_request:
    branches: [master]
    paths: ['packages/x-fidelity-vscode/**', 'packages/x-fidelity-core/**', 'packages/x-fidelity-types/**', 'packages/x-fidelity-plugins/**']
  workflow_dispatch:

# Cost controls (2026-10-23): cancel superseded runs on the same PR/branch (never on master).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  NODE_VERSION: '22.16.0'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  # macOS/Windows only on main or label full-os (2026-10-23, cost)
  os-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        env:
          FULL_OS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-os') }}
        run: |
          if [ "$FULL_OS" = "true" ]; then
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  verify-extension:
    name: Verify Extension (${{ matrix.os }})
    needs: os-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # macOS/Windows only on main or label full-os (2026-10-23, cost)
        os: ${{ fromJSON(needs.os-matrix.outputs.os) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # - name: Setup Turborepo Remote Cache
      #   uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build

      - name: Verify extension comprehensive
        run: yarn workspace x-fidelity-vscode verify:ci

      - name: Run unit tests
        run: yarn workspace x-fidelity-vscode test:unit

      - name: Setup Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run integration tests
        run: yarn workspace x-fidelity-vscode test:integration
        env:
          DISPLAY: ${{ runner.os == 'Linux' && ':99.0' || '' }}
          # Windows-specific optimizations to prevent extension host unresponsiveness
          NODE_OPTIONS: ${{ runner.os == 'Windows' && '--max-old-space-size=4096' || '' }}
          # Reduce memory pressure on Windows CI
          VSCODE_TEST_MEMORY_LIMIT: ${{ runner.os == 'Windows' && '2048' || '' }}
          # Enable verbose logging for Windows to help debug unresponsive issues
          VSCODE_TEST_VERBOSE: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Package extension
        run: yarn workspace x-fidelity-vscode package

      - name: Bundle size check
        if: runner.os != 'Windows'
        run: |
          cd packages/x-fidelity-vscode
          echo "Extension bundle size:"
          du -h dist/extension.js
          size=$(du -k dist/extension.js | cut -f1)
          if [ $size -gt 35120 ]; then
            echo "Error: Extension bundle too large (${size}KB > 5MB)"
            exit 1
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: x-fidelity-vscode-${{ github.sha }}
          path: packages/x-fidelity-vscode/*.vsix
          retention-days: 30 
